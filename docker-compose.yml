services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: mcmonitor
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d mcmonitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      # Phase 2時点では一覧/inspectのみ許可（読み取り専用）。
      # Phase 3でstart/stop/restartを実装する際にSTART/STOP/RESTART/POSTを追加する。
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  app-backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/mcmonitor
      DOCKER_PROXY_HOST: docker-socket-proxy
      DOCKER_PROXY_PORT: 2375
      PORT: 3000

  caddy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - app-backend
    ports:
      - "80:80"

volumes:
  pgdata:
