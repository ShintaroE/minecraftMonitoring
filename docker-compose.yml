services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: mcmonitor
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d mcmonitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      # CONTAINERS: 一覧/inspect（GET）を許可。
      # POST: GET以外のメソッドを許可のうえで通す元栓。ALLOW_*と併用して初めて意味を持つ。
      # 注意: CONTAINERSとPOSTを両方1にすると、/containers配下はパスのみでの判定になるため
      #       start/stop/restart以外（remove等）も技術的には通ってしまう。app-backend側のコードで
      #       start/stop/restart以外を呼び出さないことで実質的なリスクを抑えている（plan.md参照）。
      CONTAINERS: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  app-backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/mcmonitor
      DOCKER_PROXY_HOST: docker-socket-proxy
      DOCKER_PROXY_PORT: 2375
      PORT: 3000
      SHARED_ROOT: /mnt/docker-root
    volumes:
      # 親ディレクトリを丸ごとマウント（新サーバー追加時にmount追記不要にするため。plan.md 3.3章参照）
      - /home/maki/docker:/mnt/docker-root
    networks:
      - default
      - mcmonitor-net

  caddy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - app-backend
    ports:
      - "80:80"

volumes:
  pgdata:

networks:
  default:
  mcmonitor-net:
    external: true   # 各Minecraftサーバーコンテナへ RCON 接続するための共有ネットワーク（`docker network create mcmonitor-net`で事前作成）
